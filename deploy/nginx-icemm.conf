# /etc/nginx/sites-available/icemm
#
# TLS con Let's Encrypt (certbot). REQUIERE un dominio apuntando al servidor
# (Let's Encrypt no emite certificados para IPs desnudas).
#
# Pasos de emisión (una sola vez, ya con este archivo instalado):
#   1) Reemplazar icemm.tudominio.com por el dominio real (abajo, en server_name).
#   2) sudo apt install certbot python3-certbot-nginx
#   3) sudo certbot --nginx -d icemm.tudominio.com
#      certbot agrega/gestiona las líneas ssl_certificate y renueva solo.
#
# Mientras no haya dominio/cert: usar este archivo deja el sitio en HTTP→HTTPS
# roto. Para la beta interna sin TLS, mantené el server :80 sirviendo la app
# (ver git history) hasta tener dominio.

# ── HTTP: solo ACME challenge + redirect a HTTPS ─────────────────────────────
server {
  listen 80;
  server_name icemm.tudominio.com;

  # Permitir el challenge de certbot por HTTP
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Todo lo demás → HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ── HTTPS: la app ────────────────────────────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name icemm.tudominio.com;

  # Gestionados por certbot (rutas estándar de Let's Encrypt):
  ssl_certificate     /etc/letsencrypt/live/icemm.tudominio.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/icemm.tudominio.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Frontend estático (Vite build)
  root /var/www/icemm/frontend/dist;
  index index.html;

  # Cache agresivo en assets con hash en nombre (nunca cambian)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html siempre debe ser el más nuevo (sin cache del browser)
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri $uri/ /index.html;
  }

  # Proxy hacia el backend Express
  location /api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Excel grandes
    client_max_body_size 50M;
    proxy_read_timeout 60s;
  }

  # Health check: solo desde el propio servidor (no exponer estado/errores de DB).
  # release.sh consulta directo a 127.0.0.1:3001/health, no por aquí.
  location = /health {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:3001/health;
  }

  # Hardening
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # HSTS: forzar HTTPS por 1 año (solo seguro una vez que TLS funciona).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
